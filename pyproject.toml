[project]
name = "hermes"
version = "0.1.0"
description = "Agent compute exchange"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["client*", "scheduler*", "gateway*", "experiments*", "pricing*", "agents*", "store*"]

[tool.pytest.ini_options]
testpaths = ["client/tests", "scheduler/tests", "gateway/tests", "experiments/tests", "pricing/tests", "agents/tests", "store/tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
store = ["schema.sql"]
